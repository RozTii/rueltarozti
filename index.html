<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruleta RozTi</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Ruleta RozTi</h1>
        <p>Agrega retos, gira y deja que la ruleta elija.</p>
      </div>
      <div class="status-pill" id="statusPill">Lista para girar</div>
    </header>

    <section class="layout">
      <section class="wheel-panel">
        <div class="wheel-stage">
          <div id="pointer" class="pointer" aria-hidden="true"></div>

          <div class="wheel-wrap">
            <canvas id="wheelCanvas" aria-label="Ruleta"></canvas>
            <div class="wheel-center">
              <!-- Cambia este archivo por tu propio logo -->
              <img id="logo" src="assets/logo.png" alt="logo"
                   onerror="this.classList.add('missing'); this.nextElementSibling.hidden=false;" />
              <div class="logo-fallback" hidden>LOGO</div>
            </div>
          </div>
        </div>

        <button id="spinButton" class="spin-button" type="button">
          <span class="play-icon">▶</span><span>GIRAR</span>
        </button>

        <div class="wheel-controls">
          <label>
            Velocidad lenta
            <input id="idleSpeed" type="range" min="2" max="18" value="7" />
          </label>
          <label>
            Duración del giro
            <input id="spinDuration" type="range" min="2" max="9" value="5" />
          </label>
          <label class="switch-row">
            <span>Sonido</span>
            <input id="soundEnabled" type="checkbox" checked />
          </label>
        </div>
      </section>

      <aside class="elements-panel">
        <div class="panel-head">
          <span class="eyebrow">ELEMENTOS</span>
          <strong id="countLabel">(0)</strong>
        </div>

        <form id="addForm" class="add-row">
          <input id="itemInput" type="text" maxlength="90"
                 placeholder="Escribe un reto o texto..." autocomplete="off" />
          <button aria-label="Agregar elemento" title="Agregar">+</button>
        </form>

        <div id="itemsList" class="items-list"></div>

        <div class="panel-actions">
          <button id="clearButton" class="secondary" type="button">Limpiar</button>
          <button id="resetButton" class="secondary" type="button">↻ Reset</button>
        </div>

        <p class="tip">
          El puntero vibra con cada casilla, la ruleta tiene halo durante el giro
          y la casilla ganadora queda iluminada.
        </p>
      </aside>
    </section>
  </main>

  <div id="resultModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
      <button class="modal-close" type="button" aria-label="Cerrar" data-close-modal>×</button>
      <div class="result-badge">RESULTADO</div>
      <h2 id="resultTitle">¡Tu reto es!</h2>
      <p id="resultText"></p>
      <button id="againButton" class="spin-button modal-spin" type="button">GIRAR DE NUEVO</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
