<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ruleta RozTi</title>
  <meta name="description" content="Ruleta de retos interactiva">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Botón para abrir el menú de retos -->
  <button id="retosButton" class="retos-button" type="button"
          aria-controls="retosPanel" aria-expanded="false">
    RETOS
  </button>

  <!-- Fondo para cerrar el menú al hacer clic fuera -->
  <div id="panelBackdrop" class="panel-backdrop" aria-hidden="true"></div>

  <main class="app">
    <header class="topbar">
      <h1>Ruleta RozTi</h1>
    </header>

    <section class="layout">
      <div class="wheel-column">
        <div class="wheel-wrap" aria-label="Ruleta de retos">
          <div class="pointer" aria-hidden="true"></div>
          <canvas id="wheel" width="700" height="700"></canvas>
          <button id="centerButton" class="center-button" aria-label="Girar la ruleta">
            <!-- Cambia assets/avatar.png por tu propio logo -->
            <img id="logo" src="assets/logo.png" alt="logo">
          </button>
        </div>

        <button id="spinButton" class="spin-button">
          <span class="play-icon">▶</span>
          GIRAR
        </button>

        <p id="resultText" class="result" aria-live="polite"></p>
      </div>

      <aside id="retosPanel" class="panel" aria-hidden="true">
        <div class="panel-header">
          <h2>RETOS (<span id="count">0</span>)</h2>
          <button id="closeRetos" class="close-retos" type="button" aria-label="Cerrar menú de retos">×</button>
        </div>

        <div class="add-row">
          <input id="itemInput" type="text" maxlength="80"
                 placeholder="Escribe un reto o texto..."
                 autocomplete="off">
          <button id="addButton" class="icon-button" aria-label="Agregar reto">+</button>
        </div>

        <div id="items" class="items"></div>

        <div class="actions">
          <button id="clearButton" class="secondary-button">Limpiar</button>
        </div>
      </aside>
    </section>
  </main>

  <!-- Ventana de resultado -->
  <div id="resultModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="resultTitle" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div class="modal-card">
      <button id="closeModal" class="modal-close" type="button" aria-label="Cerrar">×</button>
      <div class="modal-kicker"> </div>
      <h2 id="resultTitle">Tu resultado</h2>
      <div id="modalResult" class="modal-result"></div>
      <button id="modalOk" class="modal-ok" type="button">¡Entendido!</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
